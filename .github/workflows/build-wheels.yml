name: Build Python Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - macos-15
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cibuildwheel build ninja

      - name: Install Boost on macOS
        if: runner.os == 'macOS'
        run: |
          brew install boost
          echo "BOOST_ROOT=$(brew --prefix boost)" >> "$GITHUB_ENV"
          echo "Boost installed at: $(brew --prefix boost)"
          ls "$(brew --prefix boost)/include/boost"

      - name: Install Boost on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Install Boost on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on this runner."
          }

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed to install Boost."
          }

          $boostInclude = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include"

          if (-not (Test-Path "$boostInclude\boost")) {
            throw "Boost headers not found at $boostInclude"
          }

          "BOOST_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "Boost installed at: $boostInclude"

      - name: Show build environment
        shell: bash
        run: |
          python --version
          python -m pip --version
          python -m pip show cibuildwheel
          git --version
          cmake --version

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP: "*-win32 *-musllinux*"
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_DEBUG_TRACEBACK: "true"

          # Pass Boost locations to CMake inside the wheel build.
          CIBW_ENVIRONMENT_MACOS: 'CMAKE_ARGS="-DBoost_ROOT=$BOOST_ROOT -DBoost_INCLUDE_DIR=$BOOST_ROOT/include"'
          CIBW_ENVIRONMENT_LINUX: 'CMAKE_ARGS="-DBoost_ROOT=/usr -DBoost_INCLUDE_DIR=/usr/include"'
          CIBW_ENVIRONMENT_WINDOWS: 'CMAKE_ARGS="-DBoost_ROOT=%BOOST_ROOT% -DBoost_INCLUDE_DIR=%BOOST_ROOT%/include"'

          CIBW_TEST_COMMAND: >-
            python -c "import quantlib_addin; print(quantlib_addin.__file__)"

      - name: List built wheels
        if: success()
        shell: bash
        run: |
          echo "Built wheel files:"
          ls -lh wheelhouse

      - name: Upload wheel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
