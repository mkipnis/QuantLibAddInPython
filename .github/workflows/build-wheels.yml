
name: Build Python Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - macos-15
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cibuildwheel build ninja

      - name: Install macOS tools and Boost
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade delocate
          brew install boost

          BOOST_PREFIX="$(brew --prefix boost)"
          echo "BOOST_ROOT=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "Boost prefix: $BOOST_PREFIX"

          test -d "$BOOST_PREFIX/include/boost"

      - name: Install Boost on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set."
          }

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost:x64-windows-static-md

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Boost with vcpkg."
          }

          $boostRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"

          if (-not (Test-Path "$boostRoot\include\boost")) {
            throw "Boost headers not found at $boostRoot\include"
          }

          "BOOST_ROOT=$boostRoot" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Boost root: $boostRoot"
          Get-ChildItem "$boostRoot\share\boost" -ErrorAction SilentlyContinue

      - name: Show build environment
        shell: bash
        run: |
          python --version
          python -m pip --version
          python -m pip show cibuildwheel
          git --version
          cmake --version

      - name: Diagnose Windows Boost configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "BOOST_ROOT=$env:BOOST_ROOT"

          if (-not (Test-Path "$env:BOOST_ROOT\include\boost")) {
            throw "Boost headers are missing."
          }

          Write-Host "Boost libraries:"
          Get-ChildItem "$env:BOOST_ROOT\lib" -ErrorAction SilentlyContinue |
            Select-Object -First 30 -ExpandProperty Name

          Write-Host "Boost CMake package files:"
          Get-ChildItem "$env:BOOST_ROOT\share\boost" -ErrorAction SilentlyContinue

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP: "*-win32 *-musllinux*"
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_DEBUG_TRACEBACK: "true"

          # Build Boost 1.88.0 from source inside the manylinux container.
          CIBW_BEFORE_ALL_LINUX: >-
            set -eux;
            (yum install -y curl tar ||
             dnf install -y curl tar);
            curl -L --fail
            https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.gz
            -o /tmp/boost.tar.gz;
            tar -xzf /tmp/boost.tar.gz -C /tmp;
            cd /tmp/boost_1_88_0;
            ./bootstrap.sh --prefix=/usr/local;
            ./b2 -j2
            --with-json
            --with-serialization
            --with-filesystem
            --with-system
            --with-date_time
            --with-chrono
            --with-atomic
            --with-container
            variant=release
            link=shared
            runtime-link=shared
            threading=multi
            --prefix=/usr/local
            --libdir=/usr/local/lib
            install;
            ldconfig

          CIBW_ENVIRONMENT_LINUX: >-
            BOOST_ROOT=/usr/local
            CMAKE_ARGS="-DBoost_ROOT=/usr/local -DBoost_INCLUDE_DIR=/usr/local/include -DBoost_USE_STATIC_LIBS=OFF"

          # Homebrew Boost on macOS.
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=15.0
            BOOST_ROOT=$BOOST_ROOT
            CMAKE_ARGS="-DBoost_ROOT=$BOOST_ROOT -DBoost_INCLUDE_DIR=$BOOST_ROOT/include -DBoost_USE_STATIC_LIBS=OFF"

          # Static Boost libraries with the dynamic MSVC runtime.
          CIBW_ENVIRONMENT_WINDOWS: >-
            BOOST_ROOT=$BOOST_ROOT
            CMAKE_ARGS="-DBoost_ROOT=$BOOST_ROOT -DBoost_USE_STATIC_LIBS=ON -DBoost_USE_STATIC_RUNTIME=OFF -DBoost_USE_DEBUG_RUNTIME=OFF"

          # Bundle non-system shared libraries into macOS wheels.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs}
            -w {dest_dir} -v {wheel}

          # Linux uses cibuildwheel's default auditwheel repair command.

          # Smoke test: import, initialize, and check version APIs.
          CIBW_TEST_COMMAND: >-
            python -c "import quantlib_addin as qla;
            qla.initializeAddin();
            assert qla.qlAddinVersion(False);
            assert qla.ohVersion(False);
            print('QuantLibAddin smoke test passed')"

      - name: Inspect macOS native libraries
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          echo "Native libraries in workspace:"
          find . \( -name '*.so' -o -name '*.dylib' \) -print || true

          echo "Wheel files in workspace:"
          find . -type f -name '*.whl' -print || true

      - name: List built wheels
        if: success()
        shell: bash
        run: |
          echo "Built wheel files:"
          ls -lh wheelhouse

      - name: Upload wheel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  gather-wheels:
    name: Gather wheels from all platforms
    runs-on: ubuntu-24.04
    needs: build-wheels

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Inspect distributions
        shell: bash
        run: |
          echo "Collected distributions:"
          ls -lh dist/

          if ! compgen -G "dist/*.whl" > /dev/null; then
            echo "ERROR: No wheel files found."
            exit 1
          fi

      - name: Upload merged wheels
        uses: actions/upload-artifact@v4
        with:
          name: merged-wheels
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: gather-wheels

    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/quantlib-addin

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          package_name = project["name"]
          package_version = project["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")

          print(f"Package: {package_name}")
          print(f"Package version: {package_version}")
          print(f"Git tag version: {tag_version}")

          if package_name.lower().replace("_", "-") != "quantlib-addin":
              raise SystemExit(
                  f"Unexpected package name: {package_name}"
              )

          if package_version != tag_version:
              raise SystemExit(
                  "ERROR: Git tag does not match pyproject.toml version."
              )
          PY

      - name: Retrieve merged wheels
        uses: actions/download-artifact@v4
        with:
          name: merged-wheels
          path: dist/

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
